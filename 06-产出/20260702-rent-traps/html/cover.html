<!DOCTYPE html>
<!-- 本次运行的封面实例（基于 cover-number 模板，按用户 ★1 反馈微调：kicker 加大至与 headline 同号、"坑"字暗红、headline 加"月"） -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#FFFDF7;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:110px 90px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:76px;font-weight:900;line-height:1.3;color:#FF7A1A;word-break:break-all;}
.numwrap{margin:auto 0;display:flex;align-items:baseline;flex-wrap:wrap;}
.number{font-size:400px;font-weight:900;line-height:0.9;color:#FF7A1A;letter-spacing:-8px;}
.unit{font-size:110px;font-weight:900;margin-left:16px;word-break:break-all;}
.unit .keng{color:#9E2B25;}
.headline{font-size:76px;font-weight:900;line-height:1.3;word-break:break-all;}
</style></head><body>
<div class="page">
  <div class="kicker">刚工作租房必看的</div>
  <div class="numwrap"><span class="number">5</span><span class="unit">个<span class="keng">坑</span></span></div>
  <div class="headline">每个月都在偷偷多花你几千块</div>
</div>
</body></html>
