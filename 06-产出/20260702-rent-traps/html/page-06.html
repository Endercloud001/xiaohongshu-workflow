<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#FFFDF7;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:#FF7A1A;font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.title{font-size:80px;font-weight:900;margin:40px 0 64px;}
.recap{font-size:42px;line-height:1.7;color:#444;margin-bottom:24px;padding-left:40px;position:relative;word-break:break-all;}
.recap::before{content:"·";position:absolute;left:0;color:#FF7A1A;font-weight:900;font-size:56px;line-height:1.2;}
.cta{margin-top:auto;background:#FF7A1A;color:#fff;border-radius:24px;
  padding:48px 56px;font-size:48px;font-weight:bold;text-align:center;line-height:1.4;word-break:break-all;}
</style></head><body>
<div class="page">
  <div class="kicker">收藏不踩雷</div>
  <div class="title">租房前翻一遍</div>
  <div class="recap">押金写进合同、尽量押一付一</div>
  <div class="recap">中介费能砍，优先找直租房源</div>
  <div class="recap">实地看房 + 所有承诺白纸黑字</div>
  <div class="cta">点赞收藏，签约前再翻一遍 ✅</div>
  <div class="pageno">06/06</div>
</div>
</body></html>
