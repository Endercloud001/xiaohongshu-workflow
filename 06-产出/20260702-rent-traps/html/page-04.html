<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#FFFDF7;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:#FF7A1A;font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.headline{font-size:84px;font-weight:900;line-height:1.25;
  margin:auto 0;word-break:break-all;}
.headline em{font-style:normal;color:#FF7A1A;}
.sub{font-size:44px;line-height:1.6;color:#444;margin-bottom:40px;}
.bar{width:160px;height:16px;background:#FF7A1A;margin-bottom:48px;}
</style></head><body>
<div class="page">
  <div class="kicker">坑④ 水电煤</div>
  <div class="headline">水电按<em>商业价</em>偷偷收</div>
  <div class="bar"></div>
  <div class="sub">1.5 元/度电、莫名公摊，一年多花上千。签约前问清单价和缴费方式。</div>
  <div class="pageno">04/06</div>
</div>
</body></html>
