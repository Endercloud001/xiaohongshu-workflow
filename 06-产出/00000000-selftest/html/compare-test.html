<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#FFFFFF;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:#2AA876;font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.title{font-size:72px;font-weight:900;margin:24px 0 56px;}
.cols{display:flex;gap:32px;flex:1;}
.col{flex:1;border-radius:24px;padding:48px 40px;}
.col.bad{background:#F3F3F3;}
.col.good{background:#2AA87618;border:4px solid #2AA876;}
.col-head{font-size:52px;font-weight:900;margin-bottom:40px;text-align:center;}
.col.bad .col-head{color:#888;}
.col.good .col-head{color:#2AA876;}
.row{font-size:38px;line-height:1.45;margin-bottom:36px;padding-left:44px;position:relative;word-break:break-all;}
.col.bad .row::before{content:"✗";position:absolute;left:0;color:#B00;}
.col.good .row::before{content:"✓";position:absolute;left:0;color:#2AA876;font-weight:bold;}
</style></head><body>
<div class="page">
  <div class="kicker">护肤避坑指南</div>
  <div class="title">你以为的 vs 真相</div>
  <div class="cols">
    <div class="col bad"><div class="col-head">错误做法</div>
      <div class="row">早晚都用高浓度精华猛敷</div><div class="row">敏感肌盲目跟风叠加酸类</div><div class="row">晒伤当天立刻用美白产品</div><div class="row">囤积多瓶大牌从不看成分</div></div>
    <div class="col good"><div class="col-head">正确做法</div>
      <div class="row">建立耐受期循序渐进增加</div><div class="row">敏感肌先做局部测试三天</div><div class="row">晒伤先修护屏障再谈美白</div><div class="row">按肤质成分表理性做选择</div></div>
  </div>
  <div class="pageno">04</div>
</div>
</body></html>
