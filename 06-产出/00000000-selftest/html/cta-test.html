<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#FFFFFF;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:#E64A2E;font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.title{font-size:80px;font-weight:900;margin:40px 0 64px;}
.recap{font-size:42px;line-height:1.7;color:#444;margin-bottom:24px;padding-left:40px;position:relative;}
.recap::before{content:"·";position:absolute;left:0;color:#E64A2E;font-weight:900;font-size:56px;line-height:1.2;}
.cta{margin-top:auto;background:#E64A2E;color:#fff;border-radius:24px;
  padding:48px 56px;font-size:48px;font-weight:bold;text-align:center;line-height:1.4;}
</style></head><body>
<div class="page">
  <div class="kicker">今日总结时刻</div>
  <div class="title">三句话带走今天的干货</div>
  <div class="recap">早睡比任何护肤品都管用，别再熬夜找借口了</div>
  <div class="recap">记账不是抠门，是清楚知道钱去了哪里花掉</div>
  <div class="recap">对比才能看清差距，选择永远比努力更重要</div>
  <div class="cta">点击关注，第一时间收到更新提醒不迷路</div>
  <div class="pageno">06</div>
</div>
</body></html>
