<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#FFFFFF;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:#3D7EFF;font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.title{font-size:72px;font-weight:900;margin:24px 0 56px;}
.item{display:flex;gap:32px;align-items:flex-start;margin-bottom:44px;}
.num{flex:none;width:72px;height:72px;border-radius:50%;background:#3D7EFF;
  color:#fff;font-size:40px;font-weight:bold;display:flex;align-items:center;justify-content:center;}
.item-title{font-size:46px;font-weight:bold;line-height:1.3;}
.item-desc{font-size:36px;color:#555;line-height:1.5;margin-top:8px;}
</style></head><body>
<div class="page">
  <div class="kicker">新手存钱指南</div>
  <div class="title">五步搞定月存两千</div>
  <div class="item"><div class="num">1</div><div><div class="item-title">先记账再谈存钱大法</div><div class="item-desc">连续记录一周所有支出，找出隐藏的乱花钱缺口</div></div></div>
  <div class="item"><div class="num">2</div><div><div class="item-title">工资到账立刻转走</div><div class="item-desc">发薪当天自动转存，避免钱在手里越花越少</div></div></div>
  <div class="item"><div class="num">3</div><div><div class="item-title">设置消费冷静期规则</div><div class="item-desc">超过两百元的非必要消费，强制等待三天再决定</div></div></div>
  <div class="item"><div class="num">4</div><div><div class="item-title">每月复盘账单找漏洞</div><div class="item-desc">月底对照预算表逐项核对，揪出超支的具体类别</div></div></div>
  <div class="item"><div class="num">5</div><div><div class="item-title">用可视化目标做激励</div><div class="item-desc">把存钱进度做成图表贴出来，越看越有动力坚持</div></div></div>
  <div class="pageno">03</div>
</div>
</body></html>
