<!DOCTYPE html>
<!-- 封面模板·对比型（ponyo 6模板之一）。锚点=左右强反差。每侧仅一句话结论。accent_color 须 6 位 hex（good 栏拼 #7A2E2E1A 透明底）。 -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#F4F1EA;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 72px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:44px;letter-spacing:6px;color:#7A2E2E;font-weight:bold;text-align:center;word-break:break-all;}
.title{font-size:78px;font-weight:900;line-height:1.2;margin:24px 0 48px;text-align:center;word-break:break-all;}
.cols{display:flex;gap:28px;flex:1;}
.col{flex:1;border-radius:28px;padding:56px 40px;display:flex;flex-direction:column;}
.col.bad{background:#EEEEEE;}
.col.good{background:#7A2E2E1A;border:5px solid #7A2E2E;}
.mark{font-size:120px;font-weight:900;line-height:1;text-align:center;}
.col.bad .mark{color:#B00000;}
.col.good .mark{color:#7A2E2E;}
.head{font-size:52px;font-weight:900;text-align:center;margin:16px 0 32px;word-break:break-all;}
.col.bad .head{color:#777;}
.col.good .head{color:#7A2E2E;}
.point{font-size:46px;line-height:1.4;text-align:center;margin:auto 0;word-break:break-all;}
</style></head><body>
<div class="page">
  <div class="kicker">选购避坑</div>
  <div class="title">两种买法差在哪</div>
  <div class="cols">
    <div class="col bad"><div class="mark">✗</div><div class="head">冲动型</div><div class="point">看到打折就下单结果闲置吃灰</div></div>
    <div class="col good"><div class="mark">✓</div><div class="head">清单型</div><div class="point">列好需求再买每一件都用得上</div></div>
  </div>
</div>
</body></html>
