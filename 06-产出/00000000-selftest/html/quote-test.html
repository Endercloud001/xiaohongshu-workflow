<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#F5F0FF;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:#7A4FE0;font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.quote-mark{font-size:200px;color:#7A4FE0;font-family:Georgia,serif;line-height:0.6;margin-top:80px;}
.quote{font-size:76px;font-weight:900;line-height:1.5;margin:64px 0 auto;word-break:break-all;}
.attribution{font-size:38px;color:#777;text-align:right;margin-bottom:40px;}
</style></head><body>
<div class="page">
  <div class="kicker">深夜情绪电台</div>
  <div class="quote-mark">&#8220;</div>
  <div class="quote">真正的成长不是不再害怕，而是带着害怕依然往前走，把日子过成自己喜欢的模样</div>
  <div class="attribution">—— 摘自今晚的自我对话</div>
  <div class="pageno">05</div>
</div>
</body></html>
