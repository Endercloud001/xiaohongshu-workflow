<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:#FFF8F0;color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:#E64A2E;font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.headline{font-size:120px;font-weight:900;line-height:1.25;
  margin:auto 0;word-break:break-all;}
.headline em{font-style:normal;color:#E64A2E;}
.sub{font-size:44px;line-height:1.6;color:#444;margin-bottom:40px;}
.bar{width:160px;height:16px;background:#E64A2E;margin-bottom:48px;}
</style></head><body>
<div class="page">
  <div class="kicker">熬夜党必看</div>
  <div class="headline">早睡真的能<em>逆龄</em>十岁</div>
  <div class="bar"></div>
  <div class="sub">三个习惯坚持一周，皮肤肉眼可见变好</div>
  <div class="pageno"></div>
</div>
</body></html>
