<!-- 约定：accent_color 必须是 6 位 hex（如 #E64A2E），因为 .col.good 的
     background 使用 {{accent_color}}18 拼接 8 位 hex 透明度后缀（18 ≈ 9% alpha）。 -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:{{bg_color}};color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:{{accent_color}};font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.title{font-size:72px;font-weight:900;margin:24px 0 56px;}
.cols{display:flex;gap:32px;flex:1;}
.col{flex:1;border-radius:24px;padding:48px 40px;}
.col.bad{background:#F3F3F3;}
.col.good{background:{{accent_color}}18;border:4px solid {{accent_color}};}
.col-head{font-size:52px;font-weight:900;margin-bottom:40px;text-align:center;}
.col.bad .col-head{color:#888;}
.col.good .col-head{color:{{accent_color}};}
.row{font-size:38px;line-height:1.45;margin-bottom:36px;padding-left:44px;position:relative;}
.col.bad .row::before{content:"✗";position:absolute;left:0;color:#B00;}
.col.good .row::before{content:"✓";position:absolute;left:0;color:{{accent_color}};font-weight:bold;}
</style></head><body>
<div class="page">
  <div class="kicker">{{kicker}}</div>
  <div class="title">{{title}}</div>
  <div class="cols">
    <div class="col bad"><div class="col-head">{{left_head}}</div>
      <div class="row">{{left1}}</div><div class="row">{{left2}}</div><div class="row">{{left3}}</div><div class="row">{{left4}}</div></div>
    <div class="col good"><div class="col-head">{{right_head}}</div>
      <div class="row">{{right1}}</div><div class="row">{{right2}}</div><div class="row">{{right3}}</div><div class="row">{{right4}}</div></div>
  </div>
  <div class="pageno">{{page_no}}</div>
</div>
</body></html>
