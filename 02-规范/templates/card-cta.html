<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:{{bg_color}};color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:{{accent_color}};font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.title{font-size:80px;font-weight:900;margin:40px 0 64px;}
.recap{font-size:42px;line-height:1.7;color:#444;margin-bottom:24px;padding-left:40px;position:relative;word-break:break-all;}
.recap::before{content:"·";position:absolute;left:0;color:{{accent_color}};font-weight:900;font-size:56px;line-height:1.2;}
.cta{margin-top:auto;background:{{accent_color}};color:#fff;border-radius:24px;
  padding:48px 56px;font-size:48px;font-weight:bold;text-align:center;line-height:1.4;word-break:break-all;}
</style></head><body>
<div class="page">
  <div class="kicker">{{kicker}}</div>
  <div class="title">{{title}}</div>
  <div class="recap">{{recap1}}</div>
  <div class="recap">{{recap2}}</div>
  <div class="recap">{{recap3}}</div>
  <div class="cta">{{cta_text}}</div>
  <div class="pageno">{{page_no}}</div>
</div>
</body></html>
