<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
/* === 公共基座：每个模板 <style> 开头原样嵌入 === */
html,body{margin:0;padding:0;width:1080px;height:1440px;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  background:{{bg_color}};color:#1A1A1A;box-sizing:border-box;}
*,*::before,*::after{box-sizing:inherit;}
.page{width:1080px;height:1440px;padding:96px 80px;display:flex;flex-direction:column;position:relative;}
.kicker{font-size:36px;letter-spacing:8px;color:{{accent_color}};font-weight:bold;}
.pageno{position:absolute;bottom:48px;right:80px;font-size:28px;color:#999;}
/* === 模板专属 === */
.title{font-size:72px;font-weight:900;margin:24px 0 56px;}
.item{display:flex;gap:32px;align-items:flex-start;margin-bottom:44px;}
.num{flex:none;width:72px;height:72px;border-radius:50%;background:{{accent_color}};
  color:#fff;font-size:40px;font-weight:bold;display:flex;align-items:center;justify-content:center;}
.item-title{font-size:46px;font-weight:bold;line-height:1.3;}
.item-desc{font-size:36px;color:#555;line-height:1.5;margin-top:8px;}
</style></head><body>
<div class="page">
  <div class="kicker">{{kicker}}</div>
  <div class="title">{{title}}</div>
  <div class="item"><div class="num">1</div><div><div class="item-title">{{item1_title}}</div><div class="item-desc">{{item1_desc}}</div></div></div>
  <div class="item"><div class="num">2</div><div><div class="item-title">{{item2_title}}</div><div class="item-desc">{{item2_desc}}</div></div></div>
  <div class="item"><div class="num">3</div><div><div class="item-title">{{item3_title}}</div><div class="item-desc">{{item3_desc}}</div></div></div>
  <div class="item"><div class="num">4</div><div><div class="item-title">{{item4_title}}</div><div class="item-desc">{{item4_desc}}</div></div></div>
  <div class="item"><div class="num">5</div><div><div class="item-title">{{item5_title}}</div><div class="item-desc">{{item5_desc}}</div></div></div>
  <div class="pageno">{{page_no}}</div>
</div>
</body></html>
